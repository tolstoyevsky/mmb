version: "3.7"
services:
  frontend:
    image: cusdeb/nextcloud:31-amd64
    environment:
    - TYPE=frontend
    ports:
    - 8001:8001
  backend:
    image: cusdeb/nextcloud:31-amd64
    environment:
    - TYPE=backend
    - PM_MAX_CHILDREN=${PM_MAX_CHILDREN}
    - PM_START_SERVERS=${PM_START_SERVERS}
    - PM_MIN_SPARE_SERVERS=${PM_MIN_SPARE_SERVERS}
    - PM_MAX_SPARE_SERVERS=${PM_MAX_SPARE_SERVERS}
    volumes:
    - ./_config:/var/www/nc/config
    - ./_nc/data:/var/www/nc/data
  news_updater:
    image: cusdeb/nextcloud:31-amd64
    environment:
    - TYPE=news_updater
    volumes:
    - ./_config:/var/www/nc/config
    - ./_nc/data:/var/www/nc/data
  notify_push:
    image: cusdeb/notify_push:1.2.2-amd64
    environment:
    - NEXTCLOUD_URL=http://frontend:8001
    volumes:
    - ./_config:/config
    - ./_nc/data:/var/www/nc/data
  signaling:
    image: cusdeb/nextcloud:31-amd64
    environment:
    - TYPE=signaling
    - NATS_URL=nats://nats:4222
    - SIGNALING_SECRET=${SIGNALING_SECRET}
    # Set to true only if Nextcloud is served with a certificate this server
    # does not trust (e.g. self-signed). Keep unset/false in production.
    - SIGNALING_SKIP_VERIFY=${SIGNALING_SKIP_VERIFY}
  nats:
    image: cusdeb/nextcloud:31-amd64
    environment:
    - TYPE=nats
  coturn:
    image: cusdeb/coturn:4.6.2
    environment:
    - AUTH_SECRET=${TURN_SECRET}
    - REALM=nextcloud
    ports:
    - 3478:3478
    - 3478:3478/udp
    - 5349:5349
    - 5349:5349/udp
    - 49160-49200:49160-49200/udp
  talk_provision:
    image: cusdeb/nextcloud:31-amd64
    environment:
    - TYPE=talk_provision
    # The .../standalone-signaling/ URL, reachable from both browsers and the stack.
    - SIGNALING_URL=${SIGNALING_URL}
    - SIGNALING_SECRET=${SIGNALING_SECRET}
    - SIGNALING_VERIFY=${SIGNALING_VERIFY}
    - TURN_SERVER=${TURN_SERVER}
    - TURN_SECRET=${TURN_SECRET}
    - STUN_SERVER=${STUN_SERVER}
    restart: "no"
    volumes:
    - ./_config:/var/www/nc/config
    - ./_nc/data:/var/www/nc/data
  mariadb:
    image: cusdeb/mariadb:10.6-amd64
    environment:
    - MYSQLD_bind_address=mariadb
    - MYSQLD_innodb_file_per_table=1
    - MYSQL_DATABASE=nc
    - MYSQL_ROOT_PASSWORD=secret
    volumes:
    - ./_db:/var/lib/mysql
  redis:
    image: cusdeb/redis:6.0-amd64
    environment:
    - BIND=redis
    - PORT=6379
    - REDIS_CONF_maxmemory=512mb
    - REDIS_CONF_maxmemory_policy=allkeys-lru
    - REDIS_CONF_tcp_keepalive=0
    # Disable AOF
    - REDIS_CONF_appendonly=no
    # Disable RDB
    - REDIS_CONF_save=

